[package]
name = "polars-candle"
version = "0.1.10"
edition = "2021"
authors = ["Wouter Doppenberg <wouterdoppenberg@gmail.com>"]
description = "A text embedding extension for the Polars Dataframe library."
keywords = ["polars", "dataframe", "embedding", "nlp", "candle"]
license = "Apache-2.0"

[lib]
name = "polars_candle"
crate-type = ["cdylib"]


[dependencies]
glowrs = "0.4.1"
polars = { version = "0.45.1", features = ["lazy", "dtype-array", "dtype-categorical", "ndarray", "log"] }
pyo3 = { version = "^0.22", features = ["extension-module"] }
pyo3-polars = { version = "0.19.0", features = ["derive"] }
serde = { version = "1.0.197", features = ["derive"] }
candle-core = "0.8.2"


[features]
default = []
metal = ["glowrs/metal"]
accelerate = ["glowrs/accelerate"]
cuda = ["glowrs/cuda"]

[profile.release]
codegen-units = 1
strip = "debuginfo"
lto = "thin"
