name: build-wheels

on:
  # Do this when a new release is published
  push:
    branches: [ master ]
  pull_request:
  release:
    types: [ published ]

jobs:
  # Build for manylinux, which allows it to be run on many different Linux platforms
  test:
    strategy:
      matrix:
        runner: [ ubuntu-latest, macos-14 ]
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Set up the repository with the Docker container action, which will allow us to build and run a manylinux Docker
    # container that will ensure compatibility. See the action repository for more info.
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Check if Cargo.toml version & pyproject.toml version match
      if: matrix.runner == 'ubuntu-latest'
      run: |
        CARGO_VERSION=$(grep -e '^version\s*=\s*"' Cargo.toml | head -1 | cut -d '"' -f2)
        POETRY_VERSION=$(poetry version -s)
        if [ "$CARGO_VERSION" != "$POETRY_VERSION" ]; then
          exit 1
        fi

    - name: Run pre-commit
      run: uvx pre-commit run --all

    - name: Cargo Test
      run: cargo test

    - name: PyTest
      run: uv run pytest

  build:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test ]
    strategy:
      matrix:
        runner: [ ubuntu-latest, macos-14, windows-latest ]
        py-version: [ '3.9', '3.10', '3.11', '3.12' ]

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --wheel --python ${{ matrix.py-version }}

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-darwin-${{ matrix.py-version }}
          path: ${{ github.workspace }}/dist/*

  build-sdist:
    if: ${{ github.event_name == 'release' && github.event.action == 'published' }}
    needs: [ test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheel
        run: uv build --sdist --python ${{ matrix.py-version }}

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: ${{ github.workspace }}/dist/*

  wheel-publish:
    name: Release
    runs-on: ubuntu-latest
    needs: [ build, build-sdist ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Publish
        run: uv publish --check-url https://pypi.org/
